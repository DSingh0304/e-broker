name: E-Broker CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_model_key:
        description: "S3 key of candidate model for regression test"
        required: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  AWS_REGION: "ap-south-1"
  ECR_REGISTRY: "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com"

jobs:
  # ── 1. Lint & Type Check ───────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: pip install ruff mypy
      - name: Ruff (Python lint)
        run: ruff check api/ ml/
      - name: MyPy (Python types)
        run: mypy api/services/ --ignore-missing-imports --strict
      - name: ESLint + TypeScript
        run: npm run lint && npm run type-check

  # ── 2. Backend Unit Tests ──────────────────────────────────────────
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            --cov=api \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v
      - uses: codecov/codecov-action@v4
        with: { files: api/coverage.xml, flags: backend-unit }

  # ── 3. Frontend Unit Tests ─────────────────────────────────────────
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Vitest
        run: npx vitest run --coverage --coverage.thresholds.lines=70
      - uses: codecov/codecov-action@v4
        with: { files: coverage/lcov.info, flags: frontend-unit }

  # ── 4. Backend Integration Tests (Floci + local PG) ───────────────
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ebroker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install -r api/requirements-dev.txt
      # Floci via testcontainers-floci (no docker-in-docker needed)
      - name: Run integration tests
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:test@localhost:5432/ebroker_test"
          AWS_ENDPOINT_URL: "http://localhost:4566"
          AWS_ACCESS_KEY_ID: "test"
          AWS_SECRET_ACCESS_KEY: "test"
          AWS_DEFAULT_REGION: "us-east-1"
          S3_BUCKET: "ebroker-test-bucket"
          INTERNAL_API_KEY: "test-internal-key"
        run: |
          pytest api/tests/integration/ \
            --cov=api \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v

  # ── 5. Frontend Integration Tests (MSW) ───────────────────────────
  frontend-integration:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest
    needs: frontend-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx vitest run --project integration

  # ── 6. Build (Next.js + Lambda container images) ──────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Next.js build (Cloudflare Pages)
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_API_URL: "https://api.ebroker.app"
          NEXTAUTH_URL: "https://ebroker.pages.dev"
      - name: Build Lambda container images (dry-run)
        run: |
          docker build -f api/Dockerfile.api    -t ebroker-api:test    api/
          docker build -f api/Dockerfile.admin  -t ebroker-admin:test  api/
          docker build -f api/Dockerfile.internal -t ebroker-internal:test api/

  # ── 7. E2E Tests (Playwright) ─────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend-integration]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ebroker_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed E2E DB
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:test@localhost:5432/ebroker_test"
        run: |
          pip install -r api/requirements-dev.txt
          python api/tests/e2e_seed.py
      - name: Start backend (mock inference)
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:test@localhost:5432/ebroker_test"
          MOCK_INFERENCE: "true"
          INTERNAL_API_KEY: "test-internal-key"
          AWS_ACCESS_KEY_ID: "test"
          AWS_SECRET_ACCESS_KEY: "test"
          AWS_ENDPOINT_URL: "http://localhost:4566"
        run: uvicorn api.main:app --port 8000 &
      - name: Build + Start frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXTAUTH_SECRET: "test-secret"
          NEXTAUTH_URL: "http://localhost:3000"
        run: npm run build && npm start &
      - name: Wait for services
        run: |
          timeout 30 bash -c 'until curl -s http://localhost:8000/health; do sleep 1; done'
          timeout 30 bash -c 'until curl -s http://localhost:3000; do sleep 1; done'
      - run: node e2e/scripts/generate-auth.js
      - name: Run Playwright
        run: npx playwright test --reporter=html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # ── 8. Deploy (main branch only) ──────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # AWS OIDC auth (no long-lived keys)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ebroker"
          aws-region: "${{ env.AWS_REGION }}"

      - uses: aws-actions/amazon-ecr-login@v2

      # Build & push Lambda container images
      - name: Build & push Lambda images
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          for svc in api admin internal; do
            IMAGE="$ECR_REGISTRY/ebroker-$svc:$SHORT_SHA"
            docker build -f api/Dockerfile.$svc -t $IMAGE api/
            docker push $IMAGE
            echo "IMAGE_${svc^^}=$IMAGE" >> $GITHUB_ENV
          done

      # SAM deploy (Lambda + API Gateway)
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install aws-sam-cli
      - name: SAM deploy
        run: |
          sam deploy \
            --config-file infra/sam/samconfig.toml \
            --parameter-overrides \
              ApiImageUri=$IMAGE_API \
              AdminImageUri=$IMAGE_ADMIN \
              InternalImageUri=$IMAGE_INTERNAL \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # Cloudflare Pages deploy
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Build Next.js for Cloudflare
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_API_URL: "https://api.ebroker.app"
          NEXTAUTH_URL: "https://ebroker.pages.dev"
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .vercel/output/static --project-name=ebroker
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

  # ── 9. ML Regression Gate (post-training only) ────────────────────
  ml-regression:
    name: ML Model Regression Gate
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.candidate_model_key != ''
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ebroker"
          aws-region: "${{ env.AWS_REGION }}"
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install ML deps (CPU torch for val)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics
      - name: Download models
        run: |
          aws s3 cp s3://${{ secrets.S3_BUCKET }}/models/active/best.pt /tmp/baseline.pt
          aws s3 cp s3://${{ secrets.S3_BUCKET }}/${{ github.event.inputs.candidate_model_key }} /tmp/candidate.pt
      - name: Run regression tests
        env:
          BASELINE_MODEL_PATH: /tmp/baseline.pt
          CANDIDATE_MODEL_PATH: /tmp/candidate.pt
        run: pytest ml/tests/test_model_regression.py -v --tb=short
