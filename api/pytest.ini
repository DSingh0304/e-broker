[pytest]
asyncio_mode = auto
# Session-scoped loop: the testcontainers engine (session fixture) must live
# on the SAME event loop as the tests, else asyncpg connections cross loops
# ("another operation is in progress" / protocol desync).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = api/tests
markers =
    unit: fast, no I/O
    integration: real DB, mocked external services
    slow: ML inference (skip in dev with -m "not slow")
